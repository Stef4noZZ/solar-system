[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-system-explorer"
version = "0.1.0"
description = "An interactive desktop explorer for the Solar System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5",
]

[project.scripts]
solar-system = "solar_system.app:main"

[tool.setuptools.packages.find]
where = ["src"]
